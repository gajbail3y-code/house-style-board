body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 "Libre Franklin",Arial,sans-serif;padding-inline:clamp(16px,4vw,48px);padding-block:26px 56px}
.w{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.lede{margin:0;color:var(--muted);max-width:64ch}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font:600 14px/1 inherit;padding:11px 16px;border:0;border-radius:4px;background:var(--ink);color:var(--ground);cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:500 13px/1 inherit;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

.sync{font:400 12px/1.3 "IBM Plex Mono",monospace;color:var(--muted)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.c{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.c[data-v=yes]{border-color:var(--yes);box-shadow:0 0 0 1px var(--yes)}
.c[data-v=no] img{filter:grayscale(1);opacity:.55}
.c img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
h2{font:700 19px/1.2 "Zilla Slab",Georgia,serif;margin:0}
.a{margin:0;color:var(--muted);font-size:14px}
.s,.t{margin:0;font:400 12.5px/1.4 "IBM Plex Mono",monospace;color:var(--muted)}
.l{font-weight:600;color:var(--grant);text-decoration:none}
.v{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:auto;padding-top:10px}
.v button{font:600 14px/1.1 inherit;padding:12px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.v button[data-v=yes][aria-pressed=true]{background:var(--yesbg);border-color:var(--yes);color:var(--yes)}
.v button[data-v=no][aria-pressed=true]{background:var(--nobg);border-color:var(--no);color:var(--no)}
button:focus-visible,a:focus-visible{outline:2px solid var(--grant);outline-offset:2px}
.empty{grid-column:1/-1;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}

const KEY="new-today-2026-09-21"; let state={}, filter="all";
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const sync=t=>document.getElementById("sync").textContent=t;
function render(){
  const g=document.getElementById("g");
  const show=HOMES.filter(h=>filter==="all"||state[h.id]===filter);
  g.innerHTML=show.length?show.map(h=>CARDS[h.id]).join(""):'<p class="empty">Nothing here.</p>';
  g.querySelectorAll(".c").forEach(c=>{const v=state[c.dataset.id]||"";c.dataset.v=v;
    c.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));});
  const y=HOMES.filter(h=>state[h.id]==="yes").length; sync(y?y+" to book":"Saved on this device");
}
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");
  if(f){filter=f.dataset.f;document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b===f));render();return;}
  const c=e.target.closest(".c"), b=e.target.closest("[data-v]"); if(!c||!b)return;
  state[c.dataset.id]=state[c.dataset.id]===b.dataset.v?undefined:b.dataset.v;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} render();
});
document.getElementById("send").addEventListener("click",async()=>{
  const yes=HOMES.filter(h=>state[h.id]==="yes"), no=HOMES.filter(h=>state[h.id]==="no");
  if(!yes.length&&!no.length){sync("Answer at least one first");return;}
  const text=["New homes, 2026-09-21","","YES: "+(yes.map(h=>h.town+" £"+h.price).join(", ")||"none"),"NO: "+(no.map(h=>h.town).join(", ")||"none")].join("\n");
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(state)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const url=location.origin+location.pathname+"#s="+code;
  if(navigator.share){try{await navigator.share({title:"New homes",text,url});sync("Sent");return;}catch(e){if(e.name==="AbortError")return;}}
  window.open("https://wa.me/?text="+encodeURIComponent(text+" "+url),"_blank","noopener");
});
const m=location.hash.match(/s=([A-Za-z0-9_-]+)/);
if(m){try{Object.assign(state,JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/"))))));
  localStorage.setItem(KEY,JSON.stringify(state));history.replaceState(null,"",location.pathname);}catch(e){}}
render();
